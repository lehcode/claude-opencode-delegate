name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: npm install
      - run: bun run verify
      - name: dist is up to date
        run: bun run build && test -z "$(git status --porcelain --untracked-files=all -- dist/)"
