# Release flow: conventional commits on main -> release-please PR -> merge -> tag, GitHub release.
# npm publishing is paused: the publish job runs only when the repository variable NPM_PUBLISH is 'true'.
# To resume: publish the first version by hand (`npm publish --access public`), configure the trusted
# publisher on npmjs.com (repo lehcode/claudelegate, workflow release.yml), then set NPM_PUBLISH. No npm token is used.
name: release
on:
  push:
    branches: [main]
permissions: {}
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' && vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
      - name: npm >= 11.5.1 (trusted publishing)
        run: npm install -g npm@^11.5.1
      # Lockfile-exact install without dependency lifecycle scripts: this job holds publish rights (id-token).
      - run: npm ci --ignore-scripts
      - run: bun run verify
      - name: dist is up to date
        run: bun run build && test -z "$(git status --porcelain --untracked-files=all -- dist/)"
      - run: npm publish
