# Adapted from ~/.config/vale/.vale.ini. Fetch the packages with `vale sync`.
# Scope (root and docs/ Markdown only; skips .atl, plan(s), odd, CHANGELOG.md, CLAUDE.md, AGENTS.md) is set by hooks/pre-commit.
StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Claudelegate
Packages = Microsoft, write-good, proselint

[*.md]
BasedOnStyles = Vale, Microsoft, write-good, proselint, Custom

# Domain terms and duplicates.
Microsoft.Terms = NO
write-good.Passive = NO
# Quoted strings here are literals (prompts, flags); punctuation stays outside them.
Microsoft.Quotes = NO

# House-style preferences: report, never block.
Microsoft.Contractions = warning
Microsoft.Foreign = warning
Microsoft.Dashes = warning
Microsoft.HeadingColons = warning
Microsoft.Auto = warning
proselint.Typography = warning
write-good.ThereIs = warning
